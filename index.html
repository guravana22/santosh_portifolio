<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Santosh | Software Designer &amp; Frontend Developer</title>
    <meta
      name="description"
      content="Santosh is a Software Designer and Frontend Developer specializing in modern web applications using React, JavaScript, and UI/UX best practices."
    />
    <meta
      name="keywords"
      content="Santosh, Frontend Developer, Software Designer, React Developer, Web Developer, UI UX Designer, Portfolio, JavaScript Developer"
    />
    <meta name="author" content="Santosh Guravana" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://santoshdev.vercel.app/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, Telegram, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Santosh Guravana" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://santoshdev.vercel.app/" />
    <meta property="og:title" content="Santosh | Software Designer &amp; Frontend Developer" />
    <meta
      property="og:description"
      content="Portfolio of Santosh - Software Designer &amp; Frontend Developer building modern and responsive web applications."
    />
    <meta property="og:image" content="https://santoshdev.vercel.app/og-image-2.png" />
    <meta property="og:image:secure_url" content="https://santoshdev.vercel.app/og-image-2.png" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Santosh Guravana, front-end engineer, with screenshots of recent client websites"
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://santoshdev.vercel.app/" />
    <meta name="twitter:title" content="Santosh | Software Designer &amp; Frontend Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Santosh - Software Designer &amp; Frontend Developer."
    />
    <meta name="twitter:image" content="https://santoshdev.vercel.app/og-image-2.png" />
    <meta
      name="twitter:image:alt"
      content="Santosh Guravana, front-end engineer, with screenshots of recent client websites"
    />

    <!-- Favicon + theme (matches the dark portfolio background) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0D0C12" />

    <!-- Structured data: helps Google show your name, role and profile -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Santosh Guravana",
        "jobTitle": "Frontend Developer",
        "url": "https://santoshdev.vercel.app/",
        "image": "https://santoshdev.vercel.app/og-image-2.png",
        "worksFor": { "@type": "Organization", "name": "Trustin" },
        "sameAs": ["https://www.linkedin.com/in/santosh-guravana-8a8a5828b/"]
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
